[project]
name = "abc-1212"
version = "0.0.0"
description = "Regression test framework for the abc logic synthesis system"
requires-python = ">=3.8"
dependencies = []

[tool.setuptools]
py-modules = ["regtest_runner", "util"]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]