name: Build ABC

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Get upstream ABC commit
        id: abc_sha
        run: echo "sha=$(git ls-remote https://github.com/berkeley-abc/abc.git HEAD | cut -f1)" >> $GITHUB_OUTPUT

      - name: Restore cache
        id: cache
        uses: actions/cache@v4
        with:
          path: abc/abc
          key: abc-binary-${{ steps.abc_sha.outputs.sha }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get install -y build-essential libreadline-dev

      - name: Clone ABC
        if: steps.cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 https://github.com/berkeley-abc/abc.git

      - name: Build ABC
        if: steps.cache.outputs.cache-hit != 'true'
        run: make -j$(nproc) -C abc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: abc-binary-${{ steps.date.outputs.date }}
          path: abc/abc
          retention-days: 7
