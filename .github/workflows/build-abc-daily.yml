name: Build ABC

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build-abc.yml

  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          workflow="${GITHUB_WORKFLOW_REF%%@*}"
          workflow="${workflow##*/}"
          gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/enable"
          echo "Re-enabled $workflow to reset the 60-day inactivity timer." >> "$GITHUB_STEP_SUMMARY"
