name: Build ABC

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build-abc.yml

  # GitHub disables scheduled workflows in public repos after 60 days without
  # repository activity. Re-enabling this workflow through the REST API on every
  # scheduled run keeps it alive without commits (the same call that
  # liskin/gh-workflow-keepalive makes). It lives here rather than in the reusable
  # build-abc.yml so the PR-triggered build never needs `actions: write`.
  # It cannot revive the workflow once GitHub has disabled it; that needs a
  # manual `gh workflow enable build-abc-daily.yml`.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          workflow="${GITHUB_WORKFLOW_REF%%@*}"
          workflow="${workflow##*/}"
          gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/enable"
          echo "Re-enabled $workflow to reset the 60-day inactivity timer." >> "$GITHUB_STEP_SUMMARY"
