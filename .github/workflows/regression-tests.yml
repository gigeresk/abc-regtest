name: Regression Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build ABC"]
    types: [completed]

jobs:
  check-cache:
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
      abc-sha: ${{ steps.abc_sha.outputs.sha }}
    steps:
      # Resolved once here; the build and the test restore both use this SHA.
      - name: Resolve upstream ABC commit
        id: abc_sha
        run: |
          ABC_SHA=$(git ls-remote https://github.com/berkeley-abc/abc.git HEAD | cut -f1)
          if ! printf '%s' "$ABC_SHA" | grep -Eqx '[0-9a-f]{40}'; then
            echo "::error::Not a valid upstream ABC commit SHA: '$ABC_SHA'"
            exit 1
          fi
          echo "sha=$ABC_SHA" >> "$GITHUB_OUTPUT"

      - name: Check ABC cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: abc/abc
          key: abc-binary-${{ steps.abc_sha.outputs.sha }}
          lookup-only: true

  build-if-needed:
    needs: check-cache
    if: needs.check-cache.outputs.cache-hit != 'true'
    uses: ./.github/workflows/build-abc.yml
    with:
      abc-sha: ${{ needs.check-cache.outputs.abc-sha }}

  test:
    needs: [check-cache, build-if-needed]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Record tested ABC commit
        env:
          ABC_SHA: ${{ needs.check-cache.outputs.abc-sha }}
        run: |
          {
            echo "### ABC under test"
            echo "Upstream commit: [\`$ABC_SHA\`](https://github.com/berkeley-abc/abc/commit/$ABC_SHA)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore ABC from cache
        uses: actions/cache/restore@v6
        with:
          path: abc/abc
          key: abc-binary-${{ needs.check-cache.outputs.abc-sha }}
          fail-on-cache-miss: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Run regression tests
        env:
          ABC_EXE: ${{ github.workspace }}/abc/abc
        run: python3 regtest_runner.py --badge badges/command_coverage.svg

      - name: Commit coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add badges/command_coverage.svg
          git diff --cached --quiet || git commit -m "Update coverage badge [skip ci]"
          git push
