name: Regression Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build ABC"]
    types: [completed]

jobs:
  check-cache:
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
      date: ${{ steps.date.outputs.date }}
    steps:
      - name: Get date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Check ABC cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: abc/abc
          key: abc-binary-${{ steps.date.outputs.date }}
          restore-keys: abc-binary-
          lookup-only: true

  build-if-needed:
    needs: check-cache
    if: needs.check-cache.outputs.cache-hit != 'true'
    uses: ./.github/workflows/build-abc-daily.yml

  test:
    needs: [check-cache, build-if-needed]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Restore ABC from cache
        uses: actions/cache/restore@v4
        with:
          path: abc/abc
          key: abc-binary-${{ needs.check-cache.outputs.date }}
          restore-keys: abc-binary-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run regression tests
        env:
          ABC_EXE: ${{ github.workspace }}/abc/abc
        run: python3 regtest_runner.py --badge badges/command_coverage.svg

      - name: Commit coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add badges/command_coverage.svg
          git diff --cached --quiet || git commit -m "Update coverage badge [skip ci]"
          git push
